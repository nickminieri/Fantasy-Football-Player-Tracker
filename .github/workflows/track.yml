name: Fantasy Tracker

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Allow the job to commit the updated database + report back to the repo.
permissions:
  contents: write

concurrency:
  group: fantasy-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so the push step can rebase if needed

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SEASON: ${{ secrets.SEASON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fftracker run

      - name: Commit updated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update tracker data [skip ci]"
          # Retry on rejection: if the branch advanced (e.g. a code push or a
          # stale re-run), rebase our data commit onto the latest and try again.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest..."
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH" || git rebase --abort
          done
          echo "Failed to push tracker data after retries."
          exit 1
